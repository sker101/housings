services:
  postgres:
    image: postgres:16-alpine
    container_name: campusstay-postgres
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-campusstay}
      POSTGRES_USER: ${LOCAL_DB_USER:-campusstay}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-campusstay}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-campusstay} -d ${LOCAL_DB_NAME:-campusstay}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: campusstay-backend
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/campusstay}
      DB_USERNAME: ${DB_USERNAME:-campusstay}
      DB_PASSWORD: ${DB_PASSWORD:-campusstay}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-120}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@campusstay.co.tz}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-+255700000000}
      BOOTSTRAP_SEED_DEMO_DATA: ${BOOTSTRAP_SEED_DEMO_DATA:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_AI_ENABLED: ${APP_AI_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1-mini}
      AI_MIN_CONFIDENCE: ${AI_MIN_CONFIDENCE:-0.65}
      AI_MAX_IMAGE_BYTES: ${AI_MAX_IMAGE_BYTES:-5242880}
      MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE:-12MB}
      MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE:-12MB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8081}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: campusstay-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
