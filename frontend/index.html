<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>iRent — Property Rentals in Tanzania</title>
  <meta name="description" content="iRent: Tanzania's trusted property rental marketplace. Find verified rooms in Dar es Salaam — Msasani, Masaki, Upanga and beyond. No brokers. No scams." />
  <meta name="keywords" content="iRent, Tanzania rentals, Dar es Salaam rooms, Msasani, Masaki, property rental Tanzania" />
  <meta property="og:title" content="iRent — Property Rentals in Tanzania" />
  <meta property="og:description" content="Find verified rooms in Dar es Salaam. iRent connects tenants and landlords directly." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://housings-pied.vercel.app" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="mask-icon" href="/icon-512.png" color="#16a34a" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="application-name" content="iRent" />
  <meta name="apple-mobile-web-app-title" content="iRent" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <!-- ── Splash screen — renders before any JS, dismissed by main.tsx ── -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #16a34a;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #splash.splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: 92px;
      height: 92px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      animation: splash-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .splash-logo img {
      width: 62px;
      height: 62px;
      object-fit: contain;
    }

    .splash-wordmark {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.045em;
      animation: splash-fade-up 0.5s 0.12s ease both;
    }

    .splash-wordmark em {
      font-style: normal;
      opacity: 0.7;
    }

    .splash-tagline {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.68);
      letter-spacing: 0.03em;
      animation: splash-fade-up 0.5s 0.22s ease both;
    }

    .splash-dots {
      display: flex;
      gap: 7px;
      margin-top: 8px;
      animation: splash-fade-up 0.5s 0.32s ease both;
    }

    .splash-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      animation: splash-bounce 1.3s ease-in-out infinite;
    }

    .splash-dots span:nth-child(2) { animation-delay: 0.18s; }
    .splash-dots span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes splash-pop {
      from { opacity: 0; transform: scale(0.65); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes splash-fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes splash-bounce {
      0%, 80%, 100% { transform: scale(1);   opacity: 0.55; }
      40%           { transform: scale(1.6); opacity: 1;    }
    }
  </style>
</head>

<body>
  <!-- Splash shown immediately; main.tsx adds .splash-hidden once React is ready -->
  <div id="splash">
    <div class="splash-logo">
      <img src="/icon-192.png" alt="iRent" />
    </div>
    <div class="splash-wordmark"><em>i</em>Rent</div>
    <div class="splash-tagline">Pata Nyumba Haraka Tanzania</div>
    <div class="splash-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
