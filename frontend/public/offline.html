<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iRent — Hakuna Mtandao</title>
  <meta name="theme-color" content="#16a34a" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      margin: 0;
      background: #f9fafb;
      color: #111827;
      text-align: center;
      padding: 24px;
      gap: 0;
    }
    .icon { font-size: 72px; margin-bottom: 16px; animation: pulse 2s ease-in-out infinite; }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; color: #111827; }
    p { color: #6b7280; font-size: 15px; margin: 0 0 28px; max-width: 280px; line-height: 1.55; }
    button {
      padding: 13px 36px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      box-shadow: 0 4px 16px rgba(22,163,74,0.35);
    }
    button:active { transform: scale(0.96); background: #15803d; }
    .logo {
      width: 64px; height: 64px; border-radius: 16px;
      background: #16a34a;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="logo">🏠</div>
  <div class="icon">📡</div>
  <h1>Hakuna Mtandao</h1>
  <p>Tafadhali angalia muunganiko wako wa intaneti kisha jaribu tena.</p>
  <button onclick="window.location.reload()">Jaribu Tena</button>
</body>
</html>
