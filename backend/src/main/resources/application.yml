spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusstay}
    username: ${DB_USERNAME:campusstay}
    password: ${DB_PASSWORD:campusstay}
    hikari:
      data-source-properties:
        sslmode: ${DB_SSLMODE:disable}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:12MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-very-strong-secret-key-for-production}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@campusstay.co.tz}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
    admin-phone: ${BOOTSTRAP_ADMIN_PHONE:+255700000000}
    seed-demo-data: ${BOOTSTRAP_SEED_DEMO_DATA:true}
  ai:
    enabled: ${APP_AI_ENABLED:true}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    vision-model: ${OPENAI_VISION_MODEL:gpt-4.1-mini}
    min-confidence: ${AI_MIN_CONFIDENCE:0.65}
    max-image-bytes: ${AI_MAX_IMAGE_BYTES:5242880}
